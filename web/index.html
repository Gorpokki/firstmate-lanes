<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lanes</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face { font-family:Antonio; font-weight:100 700; font-display:swap; src:url(fonts/antonio.woff2) format("woff2"); }
@font-face { font-family:"Barlow Semi Condensed"; font-weight:400; font-display:swap; src:url(fonts/barlow-semi-condensed-400.woff2) format("woff2"); }
@font-face { font-family:"Barlow Semi Condensed"; font-weight:500; font-display:swap; src:url(fonts/barlow-semi-condensed-500.woff2) format("woff2"); }
@font-face { font-family:"Barlow Semi Condensed"; font-weight:600; font-display:swap; src:url(fonts/barlow-semi-condensed-600.woff2) format("woff2"); }
:root { --text:#FFE6CC; --dim:#C6B8A8; --f1:#B58FB8; --f2:#8E7393; --f3:#3E3344; --peach:#FFCC99; --line:#2E2934; --red:#E5484D;
  --lab:Antonio,'Helvetica Neue','Arial Narrow',sans-serif; --body:'Barlow Semi Condensed','Helvetica Neue',Arial,sans-serif; --rail:128px; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#000; color:var(--text); font:17px/1.35 var(--body); }
button,select,textarea,input { font:inherit; }
.frame button { color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
button:focus-visible,select:focus-visible,a:focus-visible { outline:2px solid var(--peach); outline-offset:2px; }
.lab { font:600 14px/1 var(--lab); letter-spacing:.08em; text-transform:uppercase; }
kbd { font:500 16px/1 Menlo,'SF Mono',Consolas,monospace; color:var(--dim); text-transform:none; }

/* the LCARS frame: a top bar with an elbow, a rail of stations, and a bottom bar that is the fleet (one mark per lane) */
.frame { height:100vh; min-height:640px; display:grid; grid-template:30px 1fr 22px / var(--rail) 1fr; padding:10px 14px 10px 10px; }
.top { grid-column:1 / 3; display:flex; gap:5px; align-items:stretch; position:relative; }
.boardtog.tb { position:absolute; left:58px; top:0; height:30px; padding:0; display:flex; align-items:center; gap:8px; color:#EEE2EF; background:none; } .boardtog.tb kbd { color:#DCCFDD; margin-left:0; } .boardtog.tb:hover { color:#FFF4DC; }
.top .elbow { width:var(--rail); background:var(--f1); border-top-left-radius:30px; }
.top .bar { flex:1; background:var(--f1); margin-left:-5px; display:flex; align-items:center; justify-content:flex-end; padding-right:14px; color:#000; font:700 17px/1 var(--lab); letter-spacing:.14em; text-transform:uppercase; }
.top i { background:var(--f2); width:86px; } .top i + i { background:var(--peach); width:34px; } .top i + i + i { background:var(--f2); width:16px; border-radius:0 15px 15px 0; }
.frame .fresh { align-self:center; padding:0 2px 0 10px; color:var(--dim); white-space:nowrap; } .fresh.old::before { content:"●"; color:#E9A35A; margin-right:7px; font-size:.85em; }
.rail { display:flex; flex-direction:column; gap:5px; }
.rail .cap { height:22px; background:var(--f1); } .rail .fill { flex:1; background:var(--f3); min-height:12px; } .rail .capb { height:14px; background:var(--f2); }
.frame .rail button, .rail a { background:var(--f2); color:#000; height:46px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 10px 6px 12px; font:600 17px/1 var(--lab); letter-spacing:.08em; text-transform:uppercase; text-decoration:none; }
.rail button kbd { color:#000; font-weight:400; } .frame .rail button.on { background:var(--peach); } .frame .rail .sm { height:30px; font-size:14px; background:var(--f3); color:var(--text); } .rail .sm kbd { color:var(--dim); }
.rail button:hover, .rail a:hover { filter:brightness(1.12); }
/* on the stations for reading (Ask, List) the frame rests in dark tones, so the question is the one bright thing; on Fleet and Lane it is lit */
.frame.quiet { --f1:#4D3C55; --f2:#3B2F42; --f3:#261F2D; }
.frame.quiet .rail .fill { background:linear-gradient(var(--f1) 0 40%, #000 40% calc(40% + 5px), #4A3550 calc(40% + 5px) 64%, #000 64% calc(64% + 5px), #5A4426 calc(64% + 5px) 76%, #000 76% calc(76% + 5px), var(--f1) calc(76% + 5px)); }
.frame.quiet .top .bar, .frame.quiet .rail button:not(.on):not(.sm), .frame.quiet .tabs div button:not(.on):not(.find) { color:#C9BDCB; } .frame.quiet .rail button:not(.on) kbd { color:#C8BACC; }
.frame.quiet .rail button.on, .frame.quiet .tabs div button.on { background:var(--f2); color:var(--peach); box-shadow:inset 4px 0 0 var(--peach); } .frame.quiet .rail button.on kbd { color:var(--peach); }
.frame.quiet .tabs div button.on { box-shadow:inset 0 3px 0 var(--peach); color:#D8CCBC; }
.frame.quiet .top i + i { background:#7A5A22; } .frame.quiet .top i + i + i { background:var(--f2); }
.frame.v-fleet .bot .strip { visibility:hidden; } .frame.v-fleet .tabs .strip { display:none; }
.bot { grid-column:1 / 3; display:flex; gap:5px; }
.bot .elbow { width:var(--rail); background:var(--f2); border-bottom-left-radius:22px; }
.frame .strip { flex:1; display:flex; gap:2px; align-items:stretch; padding:7px 0 0; } .strip i { flex:1; opacity:.6; background:var(--c); } .strip i.gap { flex:0 0 8px; opacity:0; } .strip:hover i { opacity:.85; }
.frame.quiet .strip i:not(.gap) { background:#4A4550; opacity:1; }
.strip i.have { background:none; box-shadow:inset 0 0 0 1.5px var(--c); } .frame.quiet .strip i.have { background:none; box-shadow:inset 0 0 0 1.5px #A8A0AE; } /* a lane with the owner's answer to every ask: a hollow cell */
.strip i.flash, .frame.quiet .strip i.flash { animation:flash 1.8s ease-out 1; } @keyframes flash { 15%, 60% { opacity:1; background:var(--c); filter:brightness(1.7); box-shadow:0 0 0 2px #FFF4DC; } } /* a lane changed state: its mark lights once, in its state colour */
.pulse.lit { animation:lit 1.8s ease-out 1; } @keyframes lit { 15%, 60% { color:#FFF4DC; } }
@media (prefers-reduced-motion:reduce) { .strip i.flash, .pulse.lit { animation:none; } }
.frame button:disabled { opacity:.45; cursor:not-allowed; } /* a control that cannot act now looks it, in every station */
.main { position:relative; display:flex; flex-direction:column; padding:20px 26px 14px 40px; min-width:0; min-height:0; overflow:auto; }
.main::before, .main::after { content:""; position:absolute; left:0; width:20px; height:20px; pointer-events:none; }
.main::before { top:0; background:radial-gradient(circle at 100% 100%, #000 19.5px, var(--f1) 20px); } .main::after { bottom:0; background:radial-gradient(circle at 100% 0, #000 19.5px, var(--f2) 20px); }
/* the Ask station holds one decision: the rest of the board waits behind z */
.frame.focus { --rail:46px; } .frame.focus .bot .strip { visibility:hidden; } .frame.focus .main { padding-left:122px; }
.barnav { display:flex; gap:30px; margin-right:auto; margin-left:max(220px, 18%); } .frame .barnav button { background:linear-gradient(#6A5F6E, #6A5F6E) no-repeat 0 calc(100% + 5px) / 100% 1px; background-origin:content-box; color:#DCCFDE; font:600 15px/1 var(--lab); letter-spacing:.12em; text-transform:uppercase; display:inline-flex; gap:8px; align-items:baseline; } .barnav button:hover { color:#fff; }

/* every text control has one resting mark: one line under its words and its key */
.frame .link, .sim-page .link { color:var(--dim); font:600 14px/1 var(--lab); letter-spacing:.08em; text-transform:uppercase; padding:6px 0; white-space:nowrap; background:linear-gradient(#5E5560, #5E5560) no-repeat 0 calc(100% + 5px) / 100% 1px; background-origin:content-box; } .link:hover { color:var(--text); } .link kbd { margin-left:6px; }

/* the board's summary: two rows, the same on every reading station; only the need-you numbers are bright */
.topline { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 16px; margin-bottom:6px; } .topline .quiet { margin-left:auto; display:flex; gap:18px; }
.pulse { display:flex; flex-direction:column; gap:3px; color:#C4B8A8; font:600 15.5px/1.4 var(--lab); letter-spacing:.055em; word-spacing:.1em; text-transform:uppercase; } .prow { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 26px; } .pulse .prow:first-child { column-gap:38px; }
.prow:first-child > :not(.p-need):not(.br), .topline .chg { font-family:var(--body); font-weight:500; text-transform:none; letter-spacing:.01em; font-size:15px; } .prow:first-child > :not(.p-need) em.n { font-size:17px; }
.pulse b { color:#FFF4DC; font-weight:600; font-size:19.5px; } .pulse em.n { font-style:normal; font-size:18.5px; }
.prow.since { font-size:15px; color:#B5A999; } .prow.since, .prow.since * { text-transform:none; letter-spacing:.01em; font-family:var(--body); } .prow.since > * { font-weight:400; }
.frame .pulse button { font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit; } .pulse button:hover { color:var(--text); } .br { display:none; }

/* boxes over any station */
.pop { position:fixed; right:22px; top:50px; z-index:7; background:#17131B; border:1px solid #4A4252; border-radius:10px; padding:16px 20px; max-width:560px; font-size:16px; box-shadow:0 12px 40px #000c; } .pop .lab { color:var(--peach); margin-bottom:10px; display:block; }
.pop.names { max-width:640px; } .pop.names p { margin:0 0 7px; color:var(--dim); } .pop.names b { color:var(--text); font-weight:600; } .pop.names i { font-style:normal; }
.keys { display:grid; grid-template-columns:auto 1fr; gap:5px 16px; } .keys kbd { color:var(--text); }
.frame .btn, .sim-page .btn { border:1.5px solid #8F8477; border-radius:999px; padding:10px 20px; font:600 16px/1 var(--lab); letter-spacing:.08em; text-transform:uppercase; min-height:46px; display:inline-flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; } .btn:hover { background:#1D1921; } .frame .motionbtn { display:none; }
.pop.find { left:50%; right:auto; top:86px; transform:translateX(-50%); width:min(760px, calc(100vw - 20px)); max-width:none; display:flex; flex-direction:column; gap:4px; } .pop.find .lab { color:#DCCFBD; }
.find input, .pop.idx input { font:500 24px/1.2 var(--body); color:#FFF4DC; background:#000; border:1.5px solid var(--peach); border-radius:8px; padding:9px 14px; margin-bottom:6px; outline:0; width:100%; } .find input::placeholder { color:#857A70; }
.frame .hit { display:grid; grid-template-columns:11px auto auto 1fr; gap:1px 10px; align-items:baseline; padding:7px 10px; border-radius:6px; color:var(--dim); font-size:15.5px; } .hit i { width:11px; height:11px; border-radius:50%; align-self:center; } .hit b { color:var(--text); font:600 18px/1.2 var(--body); } .hit .lab { margin:0; color:var(--text); display:inline; }
.hit .q2 { grid-column:2 / 5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hit.sel, .hit:hover { background:#2A2430; } .hit.sel .q2 { color:var(--text); white-space:normal; } .find .foot { color:var(--dim); font-size:14.5px; padding:4px 10px 0; }
.veil { position:fixed; inset:0; background:#000c; z-index:6; }
.tabs { display:none; }

@media (max-width:760px) {
  .frame { display:flex; flex-direction:column; height:auto; min-height:100vh; padding:8px 8px 84px; }
  .top { height:16px; } .top .elbow { width:46px; border-top-left-radius:16px; } .top .bar { font-size:0; } .top i { width:40px; } .frame .fresh { font-size:13px; }
  .rail, .bot, .main::before, .main::after, .boardtog.tb, .barnav, .pulse .p-auto { display:none; }
  .main { padding:8px 6px 0; overflow:visible; } .frame.focus .main { padding-left:6px; } .frame.focus .tabs .strip { display:none; }
  .topline { gap:0 12px; margin-bottom:12px; } .topline .quiet { order:1; margin-left:auto; } .topline .chg { font-size:.86em; color:#C2B6A6; }
  .pulse, .prow:first-child { display:contents; } .pulse .p-need { order:0; } .br { display:block; flex-basis:100%; height:0; order:2; } .prow:first-child > :not(.p-need):not(.br) { order:3; font-size:13px; } .prow.since { order:4; display:flex; flex-basis:100%; gap:0 18px; margin-top:7px; }
  .prow > * { font:600 12.5px/1.3 var(--lab); letter-spacing:.05em; text-transform:uppercase; color:#B8AB9B; } .pulse b { font-size:15px; } .pulse em.n, .prow:first-child > :not(.p-need) em.n { font-size:13.5px; }
  .tabs { display:block; position:fixed; left:0; right:0; bottom:0; padding:5px 8px calc(6px + env(safe-area-inset-bottom)); background:#000; z-index:4; }
  .tabs::before { content:""; position:absolute; left:0; right:0; bottom:100%; height:28px; background:linear-gradient(#0000, #000); pointer-events:none; }
  .frame .tabs .strip { display:flex; width:100%; height:8px; padding:0; gap:1px; margin-bottom:6px; } .tabs .strip i.gap { flex-basis:4px; } .tabs > div { display:flex; gap:4px; }
  .frame .tabs div button { flex:1; height:48px; background:var(--f2); color:#000; font:600 14px/1 var(--lab); letter-spacing:.08em; text-transform:uppercase; display:grid; place-items:center; } .frame .tabs div button.on { background:var(--peach); }
  .frame.quiet .tabs div button:not(.on) { background:#17131B; } .tabs div button:first-child { border-radius:24px 0 0 24px; } .frame .tabs div button.find, .frame .tabs div button.more { background:var(--f3); color:#D2C2D4; } .tabs div button.more { border-radius:0 24px 24px 0; }
  .frame .motionbtn { display:inline-flex; margin:0 8px 8px 0; } .pop .keys { display:none; }
  .pop { left:10px; right:10px; top:auto; bottom:90px; } .pop.find { top:34px; bottom:auto; left:10px; right:10px; transform:none; width:auto; } .frame .hit { grid-template-columns:11px 1fr auto; } .hit span:nth-of-type(2) { display:none; } .hit .q2 { grid-column:2 / 4; } kbd.k { display:none; }
}

/* the holo view: the board's one ship renderer under every holo, its name and build, and its controls */
.holo-view { display:flex; flex-direction:column; gap:10px; min-width:0; }
canvas.ship { display:block; width:100%; height:clamp(220px,40vh,420px); cursor:grab; touch-action:none; background:#000; }
.shipname { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px; font:600 15px/1 var(--lab); letter-spacing:.1em; text-transform:uppercase; color:var(--text); } .shipname span { color:#B8AB9B; }
.tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; color:var(--dim); font-size:14px; } .tools kbd { font-size:13px; } .tools .hint { font-size:13.5px; color:#9C8F84; }
.seg2 { display:inline-flex; border:1.5px solid #8F8477; border-radius:999px; overflow:hidden; }
.holo-view .seg2 button { padding:6px 12px; min-height:32px; font:600 13px/1 var(--lab); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); background:none; border:0; border-radius:999px; cursor:pointer; }
.holo-view .seg2 button.on { color:#FFF4DC; box-shadow:inset 0 0 0 1.5px #FFF4DC; } .holo-view .seg2.cam button { min-width:34px; text-align:center; font-size:16px; }
.lane .link, .holo-view .link { border:0; border-radius:0; } /* links stay links inside the station, not boxed buttons */
/* the Lane station: the ship left with its name, build and status log; the lane's asks answered beside it */
.lane { display:flex; gap:34px; margin-top:16px; }
.lane .holo { flex:0 1 50%; min-width:0; display:flex; flex-direction:column; gap:10px; } .lane canvas.ship { height:clamp(260px,52vh,560px); }
.lane .side { flex:1 1 50%; min-width:0; display:flex; flex-direction:column; gap:14px; padding-top:6px; }
.lane h2 { font:600 24px/1.1 var(--lab); letter-spacing:.06em; text-transform:uppercase; margin:0; }
.lane .state { display:flex; flex-wrap:wrap; align-items:center; gap:9px; color:var(--dim); font-size:16px; text-transform:none; white-space:normal; } .lane .state i { width:11px; height:11px; border-radius:50%; flex:none; } .lane .state b { color:var(--text); font:600 14px/1 var(--lab); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
.nowlab { font:600 14px/1 var(--lab); letter-spacing:.1em; text-transform:uppercase; color:#B8AB9B; }
.lane p.now { margin:0; color:var(--dim); font-size:16.5px; } .lane p.big { color:var(--text); font-size:22px; } .lane .last { display:flex; flex-direction:column; gap:8px; }
.log { display:flex; flex-direction:column; gap:8px; max-height:188px; overflow-y:auto; margin-top:6px; padding-right:6px; }
.logstrip { display:flex; gap:2px; height:8px; flex:none; } .logstrip i { flex:1; border-radius:2px; }
.log ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
.log li { display:grid; grid-template-columns:136px 96px 1fr; gap:0 10px; font-size:15px; color:var(--dim); } .log li b { font:600 13.5px/1.5 var(--lab); letter-spacing:.08em; text-transform:uppercase; }
.log .at { font-family:Menlo,'SF Mono',Consolas,monospace; font-size:13px; color:#B8AB9B; } .log .tx { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; } .log li:hover .tx, .log li:focus .tx { -webkit-line-clamp:unset; color:var(--text); }
.lane .card { border-left:6px solid var(--peach); padding:4px 0 4px 18px; display:flex; flex-direction:column; gap:12px; }
.lane .ctop { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; color:var(--dim); }
.lane .q { font:500 30px/1.15 var(--body); margin:0; color:#FFF4DC; } .lane .why { margin:0; color:var(--dim); font-size:17px; }
.lane .opts { display:flex; flex-direction:column; gap:8px; }
.lane .opt { display:flex; align-items:center; gap:12px; min-height:44px; padding:8px 14px; border:1.5px solid #4A434E; border-radius:12px; background:none; color:var(--text); font-size:18px; text-align:left; cursor:pointer; }
.lane .opt.on { border-color:var(--peach); background:#2A2430; } .lane .opt .ol { display:flex; flex:1; justify-content:space-between; gap:12px; } .lane .opt small.fx { display:block; color:var(--dim); font-size:15px; } .lane .opt em { color:var(--peach); font-style:normal; font-size:14px; white-space:nowrap; }
.lane .ownans { display:flex; align-items:center; gap:10px; } .lane .ownans input { flex:1; min-width:0; color:var(--text); background:#000; border:1.5px solid #4A434E; border-radius:10px; padding:8px 12px; } .lane .ownans.on input { border-color:var(--peach); }
.lane .hint { display:flex; flex-wrap:wrap; gap:6px 18px; }
.lane .answers { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:12px; } .lane .answers ol, .lane .answers ul { margin:0; padding-left:20px; color:var(--dim); } .lane .answers .aa { color:var(--text); margin-left:8px; }
/* a lane's list of asks (i), with its own find */
.pop.names.idx { width:min(1120px, calc(100vw - 44px)); max-width:none; font-size:15px; } .pop.idx input { font-size:18px; }
.pop.idx button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:4px 8px; border:0; border-radius:4px; background:none; color:var(--text); }
.pop.idx button b { color:var(--peach); min-width:2.2em; } .pop.idx button .e { color:var(--dim); white-space:nowrap; flex:none; width:4.4em; } .pop.idx button .iq { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pop.idx button.on { background:#2A2430; color:#FFF4DC; } .pop.idx p.pv { margin:10px 0 0; padding-top:9px; border-top:1px solid #3A3440; color:var(--text); font-size:17px; } .pop.idx .foot { display:block; margin-top:8px; color:var(--dim); font-size:14px; }
/* the lane simulation: its own page, so it never reads the fleet */
.sim-page { min-height:100vh; padding:20px 26px; } .sim-page .lane { margin-top:0; } .sim-page button { color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
.lane.sim .side { gap:11px; } .lane.sim h2 { font:600 24px/1.1 var(--lab); letter-spacing:.06em; text-transform:uppercase; margin:0; }
.simrow { display:flex; flex-wrap:wrap; align-items:center; gap:10px; } .simrow select { color:var(--text); background:#17131B; border:1px solid #4A4252; border-radius:8px; padding:8px; margin-left:8px; } .sim-page .btn { min-height:38px; }
.simsteps { display:flex; flex-wrap:wrap; gap:6px; }
.sim-page .simsteps button { display:flex; align-items:center; gap:10px; min-height:32px; padding:0 12px; border:1.5px solid var(--line); border-radius:18px; color:var(--dim); font-size:15px; }
.sim-page .simsteps button.on { border-color:var(--peach); color:var(--text); } .simsteps i { width:11px; height:11px; border-radius:50%; flex:none; } .simsteps b { color:var(--text); font-weight:600; }
@media (max-width:760px) {
  .lane { flex-direction:column; gap:14px; } .lane canvas.ship { height:240px; } .lane .q { font-size:24px; } .log li { grid-template-columns:auto 80px 1fr; } .tools .hint { display:none; }
  .sim-page { padding:10px; } .pop.idx button .e { display:none; }
}
/* Fleet: the heat grid, the shipyard and the selected lane's turning ship */
.fleet-station { display:flex; flex-direction:column; min-height:0; }
.fleet-station .vtitle { display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; margin:12px 0 2px; color:var(--dim); font-size:15.5px; } .fleet-station .vtitle .lab { color:var(--text); font-size:17px; } .fleet-station .vtitle .sp { flex:1; }
