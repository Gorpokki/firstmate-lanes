name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Go lint
        run: go vet ./...
      - name: Go typecheck
        run: go build .
      - name: Go tests
        run: go test ./...
      - name: Source slop
        run: python3 scripts/slop-check.py
      - name: Documentation slop
        run: python3 scripts/doc-slop-check.py
      - name: Leak scanner self-test
        run: python3 scripts/leak-check.py --self-test
      - name: Web formatting
        run: bun run format:check
        working-directory: web
      - name: Web lint
        run: bun run lint
        working-directory: web
      - name: Web typecheck
        run: bun run typecheck
        working-directory: web
      - name: Web tests
        run: bun test
        working-directory: web
      - name: Web build
        run: bun run build && git diff --exit-code -- app.js
        working-directory: web
