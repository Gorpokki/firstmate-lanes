name: No leak scan
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  leak-check:
    name: No leak scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fetch immutable pull request commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          case "$BASE_SHA:$HEAD_SHA" in *[!0-9a-fA-F:]*) exit 1 ;; esac
          test "${#BASE_SHA}" -eq 40
          test "${#HEAD_SHA}" -eq 40
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
      - name: Require denylist and scan PR data
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_FILE: ${{ github.event_path }}
        run: |
          python3 scripts/leak-check.py --tree "$HEAD_SHA" --base "$BASE_SHA" --head "$HEAD_SHA" --event-file "$EVENT_FILE"
