name: Release
run-name: Package release ${{ github.ref_name }}
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release version and embedded web bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$version"
          test -s web/index.html
          test -s web/app.js
          test -s web/manifest.webmanifest
          test -d web/fonts
          test -n "$(find web/fonts -type f -name '*.woff2' -print -quit)"
          test -s "release-notes/$TAG.md"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Run release quality gate
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
          (cd web && bun install --frozen-lockfile && bun test && bun run build)
          git diff --exit-code -- web/app.js
      - name: Build and validate platform archives
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            executable=fmlanes
            if [[ "$os" == windows ]]; then executable=fmlanes.exe; fi
            archive="firstmate-lanes_${version}_${os}_${arch}.tar.gz"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/$executable" .
            tar -czf "dist/$archive" -C dist "$executable"
            test "$(tar -tzf "dist/$archive")" = "$executable"
            rm "dist/$executable"
          done
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 6
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = 6
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
            --title "firstmate-lanes $tag" \
            --notes-file "release-notes/$tag.md" \
            --verify-tag
