name: Simulation budget
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  simulation-budget:
    name: Simulation idle/hidden budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Web tests
        run: bun test
        working-directory: web
      # Measure the current source, not whatever bundle is checked in.
      - name: Build web bundle
        run: bun run build
        working-directory: web
      - name: Go tests
        run: go test ./...
      - name: Build server
        run: go build -o fmlanes .
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Measure simulation budgets
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node web/perf/simulation-budget.mjs --binary ./fmlanes --report simulation-budget.json
      - name: Budget report
        if: always()
        run: |
          if [ -f simulation-budget.json ]; then
            { echo '## Simulation budget'; echo; echo '| check | result | detail |'; echo '|---|---|---|';
              node -e 'const r=require("./simulation-budget.json");for(const c of r.results)console.log(`| ${c.name} | ${c.ok?"pass":"**FAIL**"} | \`${JSON.stringify(c.detail).replaceAll("|","\\|")}\` |`)'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: simulation-budget
          path: simulation-budget.json
          if-no-files-found: ignore
